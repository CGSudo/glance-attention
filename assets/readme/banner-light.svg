<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="100%" height="100%" fill="none" role="img" aria-label="Glance: Local Attention Prediction Banner (Light)">
  <defs>
    <!-- Heatmap radial blooms -->
    <radialGradient id="heat-cta-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E11D48" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#F59E0B" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#0F766E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="heat-head-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#0F766E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="heat-img-l" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#0EA5E9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur-l" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    .scan-line { stroke: #0F766E; stroke-width: 1.5; stroke-dasharray: 4 4; opacity: 0.5; }
    .dot-pulse {
      animation: pulse 5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 0.9; transform: scale(1.05); }
    }
  </style>

  <!-- Banner Background -->
  <rect width="960" height="380" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.35">
    <path d="M 60 0 V 380 M 160 0 V 380 M 260 0 V 380 M 360 0 V 380 M 460 0 V 380 M 560 0 V 380 M 660 0 V 380 M 760 0 V 380 M 860 0 V 380" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 0 60 H 960 M 0 140 H 960 M 0 220 H 960 M 0 300 H 960" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Header Branding Bar -->
  <g transform="translate(40, 28)">
    <!-- Logo Mark -->
    <path d="M 2 12 C 6 5 18 5 22 12 C 18 19 6 19 2 12 Z" stroke="#0F766E" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    <circle cx="14" cy="10.5" r="3" fill="#0F766E"/>
    <!-- Brand Name -->
    <text x="32" y="16" class="font-sans" font-weight="700" font-size="20" fill="#0F172A" letter-spacing="-0.5">Glance</text>
    <text x="106" y="16" class="font-sans" font-weight="500" font-size="13" fill="#64748B">/ attention-prediction</text>

    <!-- Header Badges -->
    <g transform="translate(680, -2)">
      <rect width="78" height="22" rx="11" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <circle cx="12" cy="11" r="3.5" fill="#0F766E"/>
      <text x="22" y="15" class="font-sans" font-size="11" font-weight="600" fill="#0F766E">100% Local</text>

      <rect x="88" y="0" width="112" height="22" rx="11" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
      <text x="98" y="15" class="font-sans" font-size="11" font-weight="500" fill="#475569">Tauri 2 + Rust + ONNX</text>
    </g>
  </g>

  <!-- Main Canvas: Mock Design Inspection Window -->
  <g transform="translate(40, 68)">
    <!-- App Container Box -->
    <rect width="560" height="280" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    
    <!-- Window Title Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 552 0 Q 560 0 560 8 L 560 28 L 0 28 Z" fill="#F1F5F9"/>
    <line x1="0" y1="28" x2="560" y2="28" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#EF4444" opacity="0.8"/>
    <circle cx="28" cy="14" r="4" fill="#F59E0B" opacity="0.8"/>
    <circle cx="40" cy="14" r="4" fill="#10B981" opacity="0.8"/>
    <text x="60" y="18" class="font-sans" font-size="11" font-weight="500" fill="#64748B">homepage-variant-b.png — Glance Analysis (SUM Model)</text>

    <!-- Mock UI Layout Inside Window -->
    <!-- Nav bar -->
    <rect x="24" y="44" width="70" height="10" rx="3" fill="#0F766E" opacity="0.8"/>
    <rect x="110" y="46" width="36" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="156" y="46" width="36" height="6" rx="2" fill="#CBD5E1"/>
    <rect x="202" y="46" width="36" height="6" rx="2" fill="#CBD5E1"/>

    <!-- Hero Content -->
    <!-- Headline -->
    <rect x="24" y="80" width="260" height="16" rx="3" fill="#1E293B"/>
    <rect x="24" y="104" width="190" height="14" rx="3" fill="#334155"/>

    <!-- Subtitle lines -->
    <rect x="24" y="132" width="240" height="8" rx="2" fill="#94A3B8"/>
    <rect x="24" y="146" width="200" height="8" rx="2" fill="#CBD5E1"/>

    <!-- CTA Button -->
    <rect x="24" y="174" width="130" height="36" rx="6" fill="#0F766E"/>
    <rect x="52" y="188" width="74" height="8" rx="2" fill="#FFFFFF"/>
    <!-- Secondary action -->
    <rect x="166" y="174" width="90" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1"/>
    <rect x="184" y="188" width="54" height="8" rx="2" fill="#64748B"/>

    <!-- Right-side Visual Card in Mock UI -->
    <rect x="310" y="74" width="224" height="148" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="326" y="90" width="192" height="74" rx="4" fill="#E2E8F0"/>
    <circle cx="370" cy="127" r="18" fill="#CBD5E1"/>
    <rect x="326" y="176" width="120" height="8" rx="2" fill="#94A3B8"/>
    <rect x="326" y="192" width="80" height="6" rx="2" fill="#CBD5E1"/>

    <!-- ================= ATTENTION HEATMAP OVERLAY ================= -->
    <!-- Heatmap Blobs with SMIL subtle breathing animations -->
    <g filter="url(#blur-l)" opacity="0.82">
      <!-- Secondary Bloom: Headline -->
      <ellipse cx="140" cy="98" rx="100" ry="34" fill="url(#heat-head-l)">
        <animate attributeName="rx" values="96; 104; 96" dur="4.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.75; 0.9; 0.75" dur="4.5s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Primary Peak Bloom: CTA Button -->
      <circle cx="88" cy="192" r="54" fill="url(#heat-cta-l)">
        <animate attributeName="r" values="50; 58; 50" dur="4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8; 0.95; 0.8" dur="4s" repeatCount="indefinite"/>
      </circle>

      <!-- Third Bloom: Card Image Feature -->
      <ellipse cx="370" cy="127" rx="55" ry="42" fill="url(#heat-img-l)">
        <animate attributeName="rx" values="52; 58; 52" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.65; 0.8; 0.65" dur="5s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- ================= SCANPATH FIXATION DOTS (1 -> 5) ================= -->
    <!-- Connecting dashed scanpath lines -->
    <path class="scan-line" d="M 140 98 L 74 138 L 88 192 L 370 127 L 60 48"/>

    <!-- Fixation 1: Headline -->
    <g transform="translate(140, 98)">
      <circle r="12" fill="#0F766E" stroke="#FFFFFF" stroke-width="2"/>
      <text y="4" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    </g>

    <!-- Fixation 2: Subtext / Lead -->
    <g transform="translate(74, 138)">
      <circle r="12" fill="#0F766E" stroke="#FFFFFF" stroke-width="2"/>
      <text y="4" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    </g>

    <!-- Fixation 3: Main CTA -->
    <g transform="translate(88, 192)">
      <circle r="13" fill="#E11D48" stroke="#FFFFFF" stroke-width="2">
        <animate attributeName="r" values="12; 14; 12" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text y="4" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    </g>

    <!-- Fixation 4: Visual Focal Anchor -->
    <g transform="translate(370, 127)">
      <circle r="12" fill="#0F766E" stroke="#FFFFFF" stroke-width="2"/>
      <text y="4" class="font-sans" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    </g>

    <!-- Fixation 5: Logo / Top Navigation -->
    <g transform="translate(60, 48)">
      <circle r="11" fill="#475569" stroke="#FFFFFF" stroke-width="2"/>
      <text y="4" class="font-sans" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
    </g>

    <!-- Bottom Status Strip in Window -->
    <rect x="0" y="254" width="560" height="26" fill="#F8FAFC"/>
    <line x1="0" y1="254" x2="560" y2="254" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="271" class="font-sans" font-size="11" fill="#64748B">Scanpath: Greedy IOR (2° fovea prior) · 5 Fixations in first 2.8s</text>
  </g>

  <!-- Right Panel: Quantitative Attention Metrics Card -->
  <g transform="translate(620, 68)">
    <rect width="300" height="280" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    <path d="M 0 8 Q 0 0 8 0 L 292 0 Q 300 0 300 8 L 300 28 L 0 28 Z" fill="#F1F5F9"/>
    <line x1="0" y1="28" x2="300" y2="28" stroke="#E2E8F0" stroke-width="1"/>
    <text x="14" y="19" class="font-sans" font-size="11" font-weight="600" fill="#334155">ATTENTION TELEMETRY</text>
    <text x="238" y="19" class="font-sans" font-size="10" font-weight="500" fill="#0F766E">EMPIRICAL</text>

    <!-- Metric 1: Clarity Score -->
    <g transform="translate(16, 44)">
      <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#64748B">VISUAL CLARITY</text>
      <text x="0" y="36" class="font-sans" font-size="24" font-weight="700" fill="#0F172A">78<tspan font-size="14" font-weight="500" fill="#94A3B8"> / 100</tspan></text>
      <rect x="90" y="22" width="60" height="18" rx="9" fill="#CCFBF1"/>
      <text x="120" y="34" class="font-sans" font-size="10" font-weight="700" fill="#0F766E" text-anchor="middle">Focused</text>
      <text x="0" y="52" class="font-sans" font-size="10" fill="#64748B">Entropy: 1 - H(map)/log(N) [64x64]</text>
    </g>

    <line x1="16" y1="108" x2="284" y2="108" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Metric 2: AOI Share -->
    <g transform="translate(16, 118)">
      <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#64748B">PRIMARY AOI SHARE (CTA)</text>
      <text x="0" y="36" class="font-sans" font-size="24" font-weight="700" fill="#0F766E">44.8%</text>
      <text x="86" y="34" class="font-sans" font-size="11" font-weight="500" fill="#059669">+16.2% vs var-A</text>
      <!-- AOI Mini progress bar -->
      <rect x="0" y="44" width="268" height="6" rx="3" fill="#E2E8F0"/>
      <rect x="0" y="44" width="120" height="6" rx="3" fill="#0F766E"/>
    </g>

    <line x1="16" y1="182" x2="284" y2="182" stroke="#F1F5F9" stroke-width="1.5"/>

    <!-- Model & Benchmark Facts -->
    <g transform="translate(16, 194)">
      <text x="0" y="12" class="font-sans" font-size="11" font-weight="600" fill="#64748B">ACTIVE MODEL</text>
      <text x="0" y="28" class="font-sans" font-size="12" font-weight="700" fill="#1E293B">SUM (WACV 2025)</text>
      <text x="130" y="28" class="font-sans" font-size="11" fill="#475569">Offline · on-device</text>

      <rect x="0" y="38" width="268" height="34" rx="4" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="8" y="52" class="font-sans" font-size="10" font-weight="600" fill="#0F766E">Offline Boundary:</text>
      <text x="8" y="65" class="font-sans" font-size="10" fill="#64748B">No telemetry · Zero cloud transfer · Local ONNX</text>
    </g>
  </g>
</svg>
