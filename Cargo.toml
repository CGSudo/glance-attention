[workspace]
members = ["crates/glance-core", "crates/glance-cli", "crates/glance-wasm", "app/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "download-binaries", "tls-native", "copy-dylibs", "api-31"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
ndarray = "=0.17.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
ureq = "=3.5.1"
base64 = "=0.23.1"
directories = "=6.0.0"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
axum = { version = "=0.8.9", features = ["multipart"] }
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
getrandom = "=0.4.3"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["cors"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
