name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/ui/package-lock.json
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable
      - run: cargo fmt --check
      - run: npm ci
        working-directory: app/ui
      - run: npm run build
        working-directory: app/ui
      - run: npm run lint
        working-directory: app/ui
      - run: npm test
        working-directory: app/ui
      - run: npm ci
        working-directory: app
      - run: node app/prepare-sidecar.mjs
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: node integrations/check.cjs
      - run: node docs/check-links.mjs
