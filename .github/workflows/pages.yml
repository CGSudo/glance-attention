name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
      - run: rustup default stable
      - run: npm ci --ignore-scripts
        working-directory: app/ui
      - name: Install pinned wasm-pack binary
        run: node node_modules/wasm-pack/install.js
        working-directory: app/ui
      - name: Fetch and verify model assets
        run: node scripts/fetch-web-models.mjs
        working-directory: app/ui
      - run: npm run build:web
        working-directory: app/ui
        env:
          GLANCE_MIRROR_MODELS: '1'
      - run: npm test
        working-directory: app/ui
      - run: node docs/check-links.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
