<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none" role="img" aria-label="Glance Social Card">
  <defs>
    <radialGradient id="glow-bg" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#0F766E" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0B1116" stop-opacity="0"/>
    </radialGradient>

    <!-- Heatmap radial blooms -->
    <radialGradient id="soc-heat-cta" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB7185" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FBBF24" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#2DD4BF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="soc-heat-head" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#2DD4BF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>

    <filter id="soc-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif; }
    .font-mono { font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, Courier, monospace; }
  </style>

  <!-- Solid Background -->
  <rect width="1280" height="640" fill="#0B1116"/>
  <!-- Ambient Deep Teal Glow -->
  <rect width="1280" height="640" fill="url(#glow-bg)"/>

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.12">
    <path d="M 120 0 V 640 M 240 0 V 640 M 360 0 V 640 M 480 0 V 640 M 600 0 V 640 M 720 0 V 640 M 840 0 V 640 M 960 0 V 640 M 1080 0 V 640 M 1200 0 V 640" stroke="#334155" stroke-width="1"/>
    <path d="M 0 80 H 1280 M 0 160 H 1280 M 0 240 H 1280 M 0 320 H 1280 M 0 400 H 1280 M 0 480 H 1280 M 0 560 H 1280" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- ================= LEFT COLUMN: HERO INFORMATION ================= -->
  <g transform="translate(80, 80)">
    <!-- Brand Logo Mark + Name -->
    <g transform="translate(0, 0)">
      <!-- Eye-like ring with off-center focus dot -->
      <path d="M 5 28 C 14 12 40 12 49 28 C 40 44 14 44 5 28 Z" stroke="#2DD4BF" stroke-width="5" fill="none" stroke-linejoin="round"/>
      <circle cx="32" cy="24" r="7.5" fill="#2DD4BF"/>
      <text x="68" y="38" class="font-sans" font-size="52" font-weight="800" fill="#F8FAFC" letter-spacing="-1.5">Glance</text>
      <!-- Sub-label chip -->
      <rect x="264" y="10" width="84" height="26" rx="13" fill="#064E3B" stroke="#0F766E" stroke-width="1.2"/>
      <text x="306" y="27" class="font-sans" font-size="12" font-weight="700" fill="#2DD4BF" text-anchor="middle">OFFLINE</text>
    </g>

    <!-- Tagline -->
    <text x="0" y="105" class="font-sans" font-size="24" font-weight="600" fill="#F1F5F9" letter-spacing="-0.5">Free desktop attention prediction.</text>
    <text x="0" y="140" class="font-sans" font-size="16" font-weight="400" fill="#94A3B8">See where people look in the first ~3 seconds of viewing.</text>
    <text x="0" y="165" class="font-sans" font-size="16" font-weight="400" fill="#94A3B8">Private, research-backed, runs completely on your computer.</text>

    <!-- 3 Key Value Props -->
    <g transform="translate(0, 205)">
      <!-- Prop 1 -->
      <g transform="translate(0, 0)">
        <circle cx="10" cy="10" r="4" fill="#2DD4BF"/>
        <text x="24" y="15" class="font-sans" font-size="15" font-weight="600" fill="#F8FAFC">100% Offline &amp; Private</text>
        <text x="24" y="34" class="font-sans" font-size="13" fill="#64748B">Zero telemetry · Images never leave your machine</text>
      </g>

      <!-- Prop 2 -->
      <g transform="translate(0, 56)">
        <circle cx="10" cy="10" r="4" fill="#2DD4BF"/>
        <text x="24" y="15" class="font-sans" font-size="15" font-weight="600" fill="#F8FAFC">Tauri 2 + Rust + ONNX</text>
        <text x="24" y="34" class="font-sans" font-size="13" fill="#64748B">Small native app · Fast local GPU/CPU execution</text>
      </g>

      <!-- Prop 3 -->
      <g transform="translate(0, 112)">
        <circle cx="10" cy="10" r="4" fill="#2DD4BF"/>
        <text x="24" y="15" class="font-sans" font-size="15" font-weight="600" fill="#F8FAFC">Empirical Metrics</text>
        <text x="24" y="34" class="font-sans" font-size="13" fill="#64748B">Transparent formulas with AUC / CC benchmarks</text>
      </g>
    </g>

    <!-- Footer metadata -->
    <g transform="translate(0, 420)">
      <rect width="180" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="21" class="font-sans" font-size="12" font-weight="600" fill="#CBD5E1">Windows · macOS · CLI</text>

      <text x="200" y="21" class="font-mono" font-size="13" font-weight="600" fill="#2DD4BF">github.com/CGSudo/glance-attention</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: APP PRODUCT VISUAL ================= -->
  <g transform="translate(680, 80)">
    <!-- App Container Box -->
    <rect width="520" height="480" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>

    <!-- App Title Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 40 L 0 40 Z" fill="#1E293B"/>
    <line x1="0" y1="40" x2="520" y2="40" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="20" r="5" fill="#F43F5E" opacity="0.8"/>
    <circle cx="36" cy="20" r="5" fill="#FBBF24" opacity="0.8"/>
    <circle cx="52" cy="20" r="5" fill="#34D399" opacity="0.8"/>
    <text x="76" y="25" class="font-sans" font-size="12" font-weight="600" fill="#94A3B8">Glance — Visual Hierarchy Analysis (SUM Model)</text>

    <!-- Inside App Canvas: Wireframe Web Page -->
    <g transform="translate(24, 60)">
      <!-- Wireframe card -->
      <rect width="472" height="320" rx="8" fill="#0B1116" stroke="#1E293B" stroke-width="1"/>

      <!-- Nav -->
      <rect x="20" y="16" width="60" height="10" rx="3" fill="#2DD4BF"/>
      <rect x="95" y="18" width="40" height="6" rx="2" fill="#334155"/>
      <rect x="145" y="18" width="40" height="6" rx="2" fill="#334155"/>
      <rect x="195" y="18" width="40" height="6" rx="2" fill="#334155"/>

      <!-- Headline & Subheadline -->
      <rect x="20" y="48" width="240" height="18" rx="3" fill="#F8FAFC"/>
      <rect x="20" y="74" width="180" height="14" rx="3" fill="#CBD5E1"/>
      <rect x="20" y="104" width="220" height="8" rx="2" fill="#64748B"/>
      <rect x="20" y="118" width="180" height="8" rx="2" fill="#475569"/>

      <!-- Primary Action Button (Target) -->
      <rect x="20" y="148" width="140" height="42" rx="6" fill="#0F766E"/>
      <rect x="52" y="164" width="76" height="10" rx="2" fill="#F8FAFC"/>

      <!-- Secondary action -->
      <rect x="172" y="148" width="90" height="42" rx="6" fill="#1E293B" stroke="#334155"/>
      <rect x="190" y="164" width="54" height="10" rx="2" fill="#94A3B8"/>

      <!-- Right image placeholder in layout -->
      <rect x="280" y="48" width="172" height="160" rx="6" fill="#1E293B" stroke="#334155"/>
      <circle cx="366" cy="110" r="28" fill="#334155"/>
      <rect x="304" y="160" width="124" height="8" rx="2" fill="#64748B"/>
      <rect x="324" y="176" width="84" height="6" rx="2" fill="#475569"/>

      <!-- ================= HEATMAP BLOOM ================= -->
      <g filter="url(#soc-blur)" opacity="0.88">
        <!-- Headline Bloom -->
        <ellipse cx="140" cy="68" rx="110" ry="38" fill="url(#soc-heat-head)"/>
        <!-- Peak CTA Bloom -->
        <circle cx="90" cy="169" r="62" fill="url(#soc-heat-cta)"/>
        <!-- Feature Image Bloom -->
        <circle cx="366" cy="110" r="48" fill="url(#soc-heat-head)" opacity="0.7"/>
      </g>

      <!-- ================= SCANPATH FIXATIONS ================= -->
      <path d="M 140 68 L 75 110 L 90 169 L 366 110 L 50 20" stroke="#2DD4BF" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.7"/>
      <!-- Dot 1 -->
      <circle cx="140" cy="68" r="13" fill="#0F766E" stroke="#2DD4BF" stroke-width="2"/>
      <text x="140" y="73" class="font-sans" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">1</text>
      <!-- Dot 2 -->
      <circle cx="75" cy="110" r="13" fill="#0F766E" stroke="#2DD4BF" stroke-width="2"/>
      <text x="75" y="115" class="font-sans" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">2</text>
      <!-- Dot 3 (Peak) -->
      <circle cx="90" cy="169" r="15" fill="#E11D48" stroke="#FDA4AF" stroke-width="2"/>
      <text x="90" y="174" class="font-sans" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <!-- Dot 4 -->
      <circle cx="366" cy="110" r="13" fill="#0F766E" stroke="#2DD4BF" stroke-width="2"/>
      <text x="366" y="115" class="font-sans" font-size="12" font-weight="700" fill="#F8FAFC" text-anchor="middle">4</text>
      <!-- Dot 5 -->
      <circle cx="50" cy="20" r="12" fill="#334155" stroke="#94A3B8" stroke-width="2"/>
      <text x="50" y="24" class="font-sans" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">5</text>
    </g>

    <!-- Bottom HUD Telemetry Strip inside Card -->
    <g transform="translate(24, 400)">
      <rect width="472" height="60" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <!-- Metric: Clarity -->
      <text x="18" y="24" class="font-sans" font-size="10" font-weight="600" fill="#94A3B8">CLARITY SCORE</text>
      <text x="18" y="46" class="font-sans" font-size="18" font-weight="700" fill="#F8FAFC">78<tspan font-size="12" font-weight="500" fill="#64748B"> / 100</tspan></text>

      <line x1="140" y1="12" x2="140" y2="48" stroke="#334155" stroke-width="1"/>

      <!-- Metric: AOI Share -->
      <text x="156" y="24" class="font-sans" font-size="10" font-weight="600" fill="#94A3B8">CTA ATTENTION SHARE</text>
      <text x="156" y="46" class="font-sans" font-size="18" font-weight="700" fill="#2DD4BF">44.8%</text>

      <line x1="310" y1="12" x2="310" y2="48" stroke="#334155" stroke-width="1"/>

      <!-- Metric: Model & AUC -->
      <text x="326" y="24" class="font-sans" font-size="10" font-weight="600" fill="#94A3B8">MODEL / MODE</text>
      <text x="326" y="46" class="font-sans" font-size="13" font-weight="700" fill="#F8FAFC">SUM · <tspan font-size="12" font-weight="500" fill="#2DD4BF">UI mode</tspan></text>
    </g>
  </g>
</svg>
