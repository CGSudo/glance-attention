[package]
name = "glance-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "glance"
path = "src/main.rs"

[features]
default = ["directml", "coreml"]
cuda = ["glance-core/cuda"]
directml = ["glance-core/directml"]
coreml = ["glance-core/coreml"]

[dependencies]
glance-core = { path = "../glance-core", default-features = false }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
directories.workspace = true
axum.workspace = true
tokio.workspace = true
getrandom.workspace = true
tower-http.workspace = true

[dev-dependencies]
tower.workspace = true
