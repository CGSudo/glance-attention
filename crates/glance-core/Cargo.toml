[package]
name = "glance-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native", "directml", "coreml"]
native = ["dep:ort", "dep:ureq", "dep:directories", "dep:sha2", "dep:ndarray"]
cuda = ["native", "ort/cuda"]
directml = ["native", "ort/directml"]
coreml = ["native", "ort/coreml"]

[dependencies]
# Select the platform's prebuilt runtime when native EP features differ by OS.
ort = { workspace = true, optional = true, features = ["lax-feature-matching"] }
image.workspace = true
ndarray = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
base64.workspace = true
directories = { workspace = true, optional = true }
thiserror.workspace = true
