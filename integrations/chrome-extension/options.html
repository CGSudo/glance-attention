<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Glance settings</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>Connect Glance</h1>
  <p>1. Run <code>glance serve</code>.</p>
  <p>2. Copy your token from <code>~/.glance/token</code> (Windows: <code>%USERPROFILE%\.glance\token</code>).</p>
  <form>
    <label for="token">3. Paste bearer token</label>
    <input id="token" type="password" autocomplete="off" required>
    <button>Save token</button>
  </form>
  <p id="status" role="status"></p>
  <p>Token stays in this browser profile. Screenshots go only to your local Glance API.</p>
</main>
<script src="options.js"></script>
</html>
