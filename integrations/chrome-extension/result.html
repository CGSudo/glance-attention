<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Glance result</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>Glance result</h1>
  <p id="status" role="status">1/2: Loading screenshot…</p>
  <p id="clarity"></p>
  <button id="settings">Connection settings</button>
  <button id="retry" hidden>Retry analysis</button>
  <label><input id="overlay" type="checkbox" checked disabled> Heatmap overlay</label>
  <label><input id="gaze" type="checkbox" checked disabled> Gaze order</label>
  <p>Gaze order: approximation (Itti &amp; Koch 1998 IOR), unless supplied by a scanpath model.</p>
  <div id="image">
    <img id="original" alt="Original captured screenshot">
    <img id="heatmap" alt="Predicted attention overlay" hidden>
    <div id="dots" aria-label="Predicted gaze order"></div>
  </div>
</main>
<script src="result.js"></script>
</html>
